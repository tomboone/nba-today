name: nba-today

services:
  nba-today:
    # `latest` tracks main; pin `sha-<7>` to roll back (README).
    image: ghcr.io/tomboone/nba-today:latest
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=nba-today

  # Polls GHCR every 5 minutes and restarts only enabled containers in the `nba-today` scope, so it
  # leaves mlb-today's containers on the same host alone. The instance carries its own scope label,
  # as Watchtower's multiple-instance docs require.
  watchtower:
    image: nickfedor/watchtower:1.23.2
    command: ["--label-enable", "--scope", "nba-today", "--interval", "300", "--cleanup"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.scope=nba-today
