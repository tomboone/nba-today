[project]
name = "nba-today"
version = "1.0.0.dev0"
description = "Daily NBA digest email"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mjml-python>=1.4.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "resend>=2.50.0",
    "typer>=0.27.3",
]

[project.scripts]
nba-today = "nba_today.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "syrupy>=6.1.1",
]
